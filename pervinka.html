<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>График Служения со стендом</title>
    <style>
      /* --- ГЛОБАЛЬНЫЕ НАСТРОЙКИ ЦВЕТА (МЕНЯЙТЕ ТОЛЬКО ЗДЕСЬ) --- */
      :root {
        --bg-main-color: #1a1a1a;          /* 1. Цвет бэкграунда основной */
        --border-main-color: rgb(250, 170, 5); /* 2. Цвет рамки основной */
        --border-cell-color: #ffffff;      /* 3. Цвет рамки для ячеек */
        
        --header-table-bg: #000000;        /* 4. Цвет шапки таблицы (название точки) */
        --header-table-text: rgb(250, 250, 250); /* 5. Цвет текста заголовка в шапке таблицы */
        
        --header-date-bg: #222222;         /* 6. Цвет шапки для названия дней и даты */
        --header-date-text: rgb(250, 250, 250); /* 7. Цвет текста для названия дней и даты */
        
        --header-time-bg: #051d3a;         /* 8. Цвет шапки для временных интервалов */
        --header-time-text: rgb(250, 250, 250); /* 9. Цвет текста для времени */
        
        --cell-input-bg: transparent;      /* 10. Цвет ячеек для записи (фон) */
        --cell-input-text: rgb(134, 255, 245); /* 11. Цвет текста для записи (ФИО) */
      }

      /* --- СТИЛИ (CSS) --- */
      body {
        background-color: var(--bg-main-color);
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
      }

     /* --- Сетка расписания --- */
    .location-card {
        border: 2px solid var(--border-main-color);
        border-radius: 5px;
        margin-bottom: 30px;
        width: 95%; /* Можно оставить */
        max-width: 1200px;
        overflow-x: auto; /* Это включает скролл */
        background-color: #000;
        -webkit-overflow-scrolling: touch; /* Плавный скролл на iPhone/Android */
    }

      .card-header {
        text-align: center;
        background-color: var(--header-table-bg);
        color: var(--header-table-text);
        font-weight: bold;
        padding: 10px;
        font-size: 1.4em;
        border-bottom: 1px solid var(--border-main-color);
      }

      .date-info {
        display: flex;
        gap: 20px;
        padding: 10px;
        color: var(--header-date-text);
        font-weight: bold;
        border-bottom: 1px solid var(--border-cell-color);
        background: var(--header-date-bg);
        /* Добавьте эту строку и установите нужный размер: */
        font-size: 1.3em;
      }

      .date-info span:first-child {
        margin-right: 15px; /* Отступ между датой и днем */
      }

      .schedule-grid {
        display: grid;
        border-collapse: collapse;
        /* ГЛАВНОЕ: Устанавливаем ширину, которая не даст ячейкам сжаться */
        min-width: 800px; 
    }

      .time-header {
        background-color: var(--header-time-bg);
        color: var(--header-time-text);
        padding: 10px;
        text-align: center;
        font-weight: bold;
        border-right: 1px solid var(--border-cell-color);
        border-bottom: 1px solid var(--border-cell-color);
        min-width: 80px;
      }

      .slot-cell {
        border-right: 1px solid var(--border-cell-color);
        border-bottom: 1px solid var(--border-cell-color);
        min-height: 40px;
        position: relative;
      }

      .slot-input {
        width: 100%;
        height: 100%;
        background: var(--cell-input-bg);
        border: none;
        color: var(--cell-input-text);
        text-align: center;
        font-size: 1em;
        padding: 10px 0;
        cursor: pointer;
        min-width: 80px;
        box-sizing: border-box;
      }

      .slot-input:focus {
        background-color: #333;
        outline: none;
      }
      
      .slot-input.occupied {
        font-weight: bold;
      }

      .slot-input:disabled {
        cursor: not-allowed;
        color: #aaa; /* Цвет для ПУСТЫХ, но недоступных ячеек */
      }

      .slot-input.occupied:disabled {
        color: var(--cell-input-text);
      }

      .delete-btn {
        display: none;
        position: absolute;
        right: 2px;
        top: 2px;
        background: red;
        color: white;
        border: none;
        border-radius: 50%;
        width: 20px;
        height: 20px;
        cursor: pointer;
        font-size: 12px;
        z-index: 10;
      }

      .controls {
        margin-bottom: 20px;
        background: #333;
        padding: 15px;
        border-radius: 8px;
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
      }

      .status-label {
        color: white;
        font-weight: bold;
        margin-right: 10px;
        padding: 5px 10px;
        border-radius: 4px;
        background: #555;
      }

      button {
        padding: 10px 20px;
        cursor: pointer;
        border: none;
        font-weight: bold;
        border-radius: 4px;
        transition: 0.3s;
      }

      .btn-user {
        background-color: var(--border-main-color);
        color: black;
      }
      .btn-admin {
        background-color: rgb(255, 25, 0);
        color: black;
      }
      .btn-config {
        background-color: #00bcd4;
        color: white;
        display: none;
      }
      .btn-logout {
        background-color: #888;
        color: white;
        display: none;
      }

      #configPanel {
        display: none;
        background: #2a2a2a;
        padding: 20px;
        border: 2px solid rgb(251, 255, 0);
        border-radius: 10px;
        width: 90%;
        max-width: 850px;
        margin-bottom: 20px;
      }
      
      .config-row {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
        flex-wrap: wrap;
        background: #444;
        padding: 10px;
        border-radius: 5px;
        align-items: center;
      }
      
      .config-input {
        padding: 5px;
        background: #fff;
        border: none;
        border-radius: 3px;
        color: #000;
      }
      
      label {
        margin-right: 2px;
        color: #ccc;
        font-size: 0.9em;
      }
      
      #loading {
        color: var(--border-main-color);
        font-size: 1.2em;
        margin-top: 20px;
      }
      
      #errorMsg {
        color: red;
        font-weight: bold;
        display: none;
        margin-top: 20px;
      }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  </head>
  <body>
    <div class="controls">
      <span id="statusLabel" class="status-label">Инициализация...</span>
      <button onclick="loginUser()" id="loginUserBtn" class="btn-user" style="display: none">Записаться</button>
      <button onclick="loginAdmin()" id="loginAdminBtn" class="btn-admin" style="display: none">Администратор</button>
      <button onclick="toggleConfigPanel()" id="configBtn" class="btn-config">⚙️ Настроить график</button>
      <button onclick="logout()" id="logoutBtn" class="btn-logout">Выйти</button>
    </div>

    <div id="configPanel">
      <h3 style="color: orange; margin-top: 0">Конструктор Расписания</h3>
      <div style="margin-bottom: 15px">
        <label>Название точки:</label>
        <input type="text" id="cfgLocationName" class="config-input" style="width: 200px" />
      </div>
      <div id="daysContainer"></div>
      <button onclick="addDayRow()" style="background: green; color: white; margin-top: 10px">+ Добавить день</button>
      <hr style="border-color: #555; margin: 20px 0" />
      <button onclick="saveConfiguration()" style="background: orange; width: 100%">СОХРАНИТЬ В ОБЛАКО</button>
    </div>

    <div id="loading">Подключение к базе данных...</div>
    <div id="errorMsg"></div>
    <div id="app"></div>

    <script>
      // --- ГЛОБАЛЬНЫЕ НАСТРОЙКИ ПАРОЛЕЙ ---
      const PASS_USER = "123";      // Пароль для Записи (служителей)
      const PASS_ADMIN = "54321";   // Пароль для Администратора

      // --- КОНФИГУРАЦИЯ FIREBASE ---
      const firebaseConfig = {
        apiKey: "AIzaSyCEJanR9v_Pvkqu974w35hBuw2LW73jpPs",
        authDomain: "stends-1360c.firebaseapp.com",
        projectId: "stends-1360c",
        storageBucket: "stends-1360c.firebasestorage.app",
        messagingSenderId: "987411316790",
        appId: "1:987411316790:web:6bdc5db2246907ed4d9897",
        measurementId: "G-E6KVRVFSQL",
      };

      // !!! УНИКАЛЬНЫЙ ID ДЛЯ КАЖДОЙ ТОЧКИ !!!
      const LOCATION_ID = "pervinka";

      // Инициализация Firebase
      let db;
      try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
        console.log("Firebase инициализирован");
      } catch (e) {
        document.getElementById("loading").style.display = "none";
        document.getElementById("errorMsg").style.display = "block";
        document.getElementById("errorMsg").innerText = "Ошибка запуска Firebase: " + e.message;
      }

      // Глобальные переменные
      let currentRole = "viewer";
      let scheduleData = { config: {}, slots: {} };

      // --- ЛОГИКА БАЗЫ ДАННЫХ ---
      if (db) {
        const locRef = db.ref("locations/" + LOCATION_ID);
        locRef.on("value", (snapshot) => {
          const data = snapshot.val();
          document.getElementById("loading").style.display = "none";

          if (data) {
            scheduleData.config = data.config || { locationName: "Без названия", days: [] };
            scheduleData.slots = data.slots || {};
          } else {
            scheduleData.config = { locationName: "Настройте график (Админ)", days: [] };
            scheduleData.slots = {};
          }

          renderSchedule();
          updateControls();
        }, (error) => {
          document.getElementById("loading").style.display = "none";
          document.getElementById("errorMsg").style.display = "block";
          document.getElementById("errorMsg").innerHTML = "Ошибка доступа к базе.<br>" + error.message;
        });
      }

      function saveSlot(slotId, name) {
        db.ref("locations/" + LOCATION_ID + "/slots/" + slotId).set(name);
      }

      function removeSlot(slotId) {
        db.ref("locations/" + LOCATION_ID + "/slots/" + slotId).remove();
      }

      function saveConfigToDb(newConfig) {
        db.ref("locations/" + LOCATION_ID + "/config")
          .set(newConfig)
          .then(() => {
            alert("Настройки сохранены!");
            toggleConfigPanel();
          })
          .catch((error) => {
            alert("Ошибка: " + error.message);
          });
      }

      // --- ИНТЕРФЕЙС И ЛОГИКА ---
      function renderSchedule() {
        const appDiv = document.getElementById("app");
        appDiv.innerHTML = "";

        const conf = scheduleData.config;
        const slots = scheduleData.slots;

        if (!conf.days || conf.days.length === 0) {
          appDiv.innerHTML = '<h2 style="color:gray; text-align:center;">Расписание не настроено. Зайдите как Администратор.</h2>';
          return;
        }

        conf.days.forEach((dayData) => {
          createDayTable(conf.locationName, dayData, slots, appDiv);
        });
      }

      function createDayTable(locName, dayData, slots, container) {
        const card = document.createElement("div");
        card.className = "location-card";

        const dateObj = new Date(dayData.date);
        const daysOfWeek = ["ВОСКРЕСЕНЬЕ", "ПОНЕДЕЛЬНИК", "ВТОРНИК", "СРЕДА", "ЧЕТВЕРГ", "ПЯТНИЦА", "СУББОТА"];
        const dayName = isNaN(dateObj.getDay()) ? "ДЕНЬ" : daysOfWeek[dateObj.getDay()];
        const ruDate = dayData.date.split("-").reverse().join(".");
        
        // Получаем шаг из данных (по умолчанию 1)
        const step = parseInt(dayData.step || 1);

        card.innerHTML = `
          <div class="card-header">${locName}</div>
          <div class="date-info">
              <span>${ruDate}</span> 
              <span>${dayName}</span> 
              <span style="margin-left:auto;">${dayData.start}:00 - ${dayData.end}:00 (Шаг: ${step} ч.)</span>
          </div>
        `;

        const startH = parseInt(dayData.start);
        const endH = parseInt(dayData.end);
        
        // Вычисляем количество временных колонок
        const intervalsCount = Math.floor((endH - startH) / step);

        const grid = document.createElement("div");
        grid.className = "schedule-grid";
        grid.style.gridTemplateColumns = `repeat(${intervalsCount}, 1fr)`;

        // Формируем заголовки времени с учетом шага
        for (let i = 0; i < intervalsCount; i++) {
          const currentStart = startH + (i * step);
          const currentEnd = currentStart + step;
          const timeCell = document.createElement("div");
          timeCell.className = "time-header";
          timeCell.innerText = `${currentStart}-${currentEnd}`;
          grid.appendChild(timeCell);
        }

        // Формируем ячейки для ввода
        for (let row = 0; row < dayData.slots; row++) {
          for (let i = 0; i < intervalsCount; i++) {
            const currentStart = startH + (i * step);
            const safeDate = dayData.date.replace(/\./g, "-");
            
            // Включаем значение шага в ID слота, чтобы данные не перемешивались при изменении структуры
            const slotId = `slot_${safeDate}_h${currentStart}step${step}_r${row}`;

            const cell = document.createElement("div");
            cell.className = "slot-cell";

            const input = document.createElement("input");
            input.className = "slot-input";
            input.id = slotId;

            const savedName = slots[slotId];
            if (savedName) {
              input.value = savedName;
              input.classList.add("occupied");
            } else {
              input.placeholder = "+";
            }

            setupInputAccess(input, savedName);

            input.addEventListener("change", function () {
              const name = this.value.trim();
              if (name) saveSlot(slotId, name);
              else removeSlot(slotId);
            });

            if (currentRole === "admin" && savedName) {
              const delBtn = document.createElement("button");
              delBtn.className = "delete-btn";
              delBtn.innerText = "x";
              delBtn.style.display = "block";
              delBtn.onclick = () => {
                if (confirm("Удалить запись?")) removeSlot(slotId);
              };
              cell.appendChild(delBtn);
            }

            cell.appendChild(input);
            grid.appendChild(cell);
          }
        }
        card.appendChild(grid);
        container.appendChild(card);
      }

      function setupInputAccess(input, isOccupied) {
        input.disabled = true;
        if (currentRole === "admin") input.disabled = false;
        else if (currentRole === "user" && !isOccupied) input.disabled = false;
      }

      // --- УПРАВЛЕНИЕ ---
      function toggleConfigPanel() {
        const panel = document.getElementById("configPanel");
        if (panel.style.display === "none" || panel.style.display === "") {
          panel.style.display = "block";
          renderConfigForm();
        } else {
          panel.style.display = "none";
        }
      }

      function renderConfigForm() {
        const conf = scheduleData.config;
        document.getElementById("cfgLocationName").value = conf.locationName || "";
        const container = document.getElementById("daysContainer");
        container.innerHTML = "";
        if (conf.days) conf.days.forEach((day) => addDayRowUI(container, day));
      }

      function addDayRow() {
        const container = document.getElementById("daysContainer");
        addDayRowUI(container, { date: "", start: 10, end: 16, slots: 2, step: 1 });
      }

      function addDayRowUI(container, dayData) {
        const currentStep = parseInt(dayData.step || 1);
        const div = document.createElement("div");
        div.className = "config-row";
        div.innerHTML = `
            <label>Дата:</label>
            <input type="date" class="cfg-date config-input" value="${dayData.date}">
            
            <label>C:</label>
            <select class="cfg-start config-input">${generateHourOptions(dayData.start)}</select>
            
            <label>До:</label>
            <select class="cfg-end config-input">${generateHourOptions(dayData.end)}</select>
            
            <label>Шаг:</label>
            <select class="cfg-step config-input">
              <option value="1" ${currentStep === 1 ? "selected" : ""}>1 час</option>
              <option value="2" ${currentStep === 2 ? "selected" : ""}>2 часа</option>
            </select>

            <label>Мест:</label>
            <input type="number" class="cfg-slots config-input" value="${dayData.slots}" min="1" max="10" style="width:45px;">
            
            <button onclick="this.parentElement.remove()" style="background:red; padding: 5px 10px; font-size: 0.8em; color:white; margin-left:auto;">Удалить</button>
        `;
        container.appendChild(div);
      }

      function generateHourOptions(selected) {
        let options = "";
        for (let i = 6; i <= 22; i++) {
          options += `<option value="${i}" ${i == selected ? "selected" : ""}>${i}:00</option>`;
        }
        return options;
      }

      function saveConfiguration() {
        const name = document.getElementById("cfgLocationName").value;
        const rows = document.querySelectorAll(".config-row");
        const newDays = [];
        let validationFailed = false;

        rows.forEach((row) => {
          const date = row.querySelector(".cfg-date").value;
          const start = parseInt(row.querySelector(".cfg-start").value);
          const end = parseInt(row.querySelector(".cfg-end").value);
          const step = parseInt(row.querySelector(".cfg-step").value);
          const slots = parseInt(row.querySelector(".cfg-slots").value);

          if (date) {
            if ((end - start) % step !== 0) {
              alert(`Ошибка для даты ${date}: Временной интервал (${start}:00 - ${end}:00) должен нацело делиться на шаг в ${step} ч.`);
              validationFailed = true;
              return;
            }
            if (start >= end) {
              alert(`Ошибка для даты ${date}: Время начала должно быть меньше времени окончания.`);
              validationFailed = true;
              return;
            }

            newDays.push({
              date: date,
              start: start,
              end: end,
              step: step,
              slots: slots
            });
          }
        });

        if (validationFailed) return;

        newDays.sort((a, b) => new Date(a.date) - new Date(b.date));
        saveConfigToDb({ locationName: name, days: newDays });
      }

      function updateControls() {
        const label = document.getElementById("statusLabel");
        const btnUser = document.getElementById("loginUserBtn");
        const btnAdmin = document.getElementById("loginAdminBtn");
        const btnConfig = document.getElementById("configBtn");
        const btnLogout = document.getElementById("logoutBtn");

        btnUser.style.display = "none";
        btnAdmin.style.display = "none";
        btnConfig.style.display = "none";
        btnLogout.style.display = "none";

        if (currentRole === "viewer") {
          label.innerText = "Режим: ТОЛЬКО ПРОСМОТР";
          label.style.background = "#555";
          btnUser.style.display = "inline-block";
          btnAdmin.style.display = "inline-block";
        } else if (currentRole === "user") {
          label.innerText = "Режим: ЗАПИСЬ";
          label.style.background = "green";
          btnLogout.style.display = "inline-block";
        } else if (currentRole === "admin") {
          label.innerText = "Режим: АДМИНИСТРАТОР";
          label.style.background = "red";
          btnConfig.style.display = "inline-block";
          btnLogout.style.display = "inline-block";
        }
      }

      function loginUser() {
        if (prompt("Пароль для Записи:") === PASS_USER) {
          currentRole = "user";
          updateControls();
          renderSchedule();
        } else alert("Неверный пароль!");
      }
      
      function loginAdmin() {
        if (prompt("Пароль Администратора:") === PASS_ADMIN) {
          currentRole = "admin";
          updateControls();
          renderSchedule();
        } else alert("Неверный пароль!");
      }
      
      function logout() {
        currentRole = "viewer";
        document.getElementById("configPanel").style.display = "none";
        updateControls();
        renderSchedule();
      }
    </script>
  </body>
</html>
